name: Relatar problema
description: Informe um erro no detonado, interface ou funcionamento.
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Obrigado por ajudar a melhorar o detonado."
  - type: textarea
    id: problem
    attributes:
      label: Problema encontrado
      description: Explique o que aconteceu e em qual etapa/área.
      placeholder: "Ex.: na etapa 42, ao clicar em..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
      description: O que deveria acontecer?
  - type: input
    id: browser
    attributes:
      label: Navegador/dispositivo
      placeholder: "Ex.: Chrome no Windows 11 / Safari no iPhone"
  - type: textarea
    id: extra
    attributes:
      label: Informações adicionais
      description: Prints, mensagens de erro ou detalhes que possam ajudar.
